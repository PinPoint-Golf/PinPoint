# Linux release pipeline — builds the self-updating AppImage and stages it as a
# DRAFT GitHub release. Signing is done LOCALLY by the maintainer (the release key
# never touches GitHub) — see docs/implementation/linux_release_runbook.md.
# Phase P2 of docs/implementation/linux_update_impl.md.
#
# The published Release IS the in-app updater's feed: UpdateController polls
# api.github.com/.../releases and AppImageUpdate resolves the gh-releases-zsync
# update-info embedded in the AppImage against these assets. A release is only
# discoverable by the updater once it is PUBLISHED (non-draft) AND carries the
# detached *.AppImage.sig (the gate refuses an unsigned release) — both happen in
# the local signing step, not here.
#
# ┌─ STATUS ────────────────────────────────────────────────────────────────────┐
# │ Scaffolding — authored, not yet run. Validate by pushing a test tag. GPU      │
# │ note: GitHub-hosted runners have no NVIDIA GPU, so this produces a CPU-capable │
# │ AppImage; for a CUDA-bundled build use a self-hosted runner with CUDA 12 +     │
# │ cuDNN 9 and set CUDA_LIB_DIR / CUDNN_LIB_DIR.                                   │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Secrets: NONE for signing — the private key stays offline (local signing). Only
# the automatic GITHUB_TOKEN is used, to create the draft release.
#
# Path A vs Path B: this workflow is the CI-draft path (Path A). The maintainer can
# instead publish a locally-built+signed release directly (Path B) — that also fires
# this workflow via the v* tag, so the `guard` job below SKIPS the build jobs when a
# PUBLISHED (non-draft) release already exists for the tag, to avoid clobbering it.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the draft GitHub Release + upload assets

jobs:
  # ── Guard: don't clobber a manually-published (Path B) release ────────────────
  # The maintainer can publish a locally-built, locally-SIGNED release directly
  # (runbook Path B) — `gh release create` makes the v* tag, which fires this
  # workflow. If we built + uploaded here, we'd re-draft that published release and
  # overwrite the signed installer with an unsigned CI build. So: if a PUBLISHED
  # (non-draft) release already exists for this tag, skip the build jobs entirely.
  # Path A (CI builds the draft) still works: there's no release yet, or only a
  # draft, so the jobs proceed.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
                    --json isDraft --jq '.isDraft' 2>/dev/null || echo "none")
          if [ "$draft" = "false" ]; then
            echo "Published release already exists for ${GITHUB_REF_NAME} — skipping CI build (Path B)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No published release for ${GITHUB_REF_NAME} (state: $draft) — proceeding (Path A)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Create the draft release ONCE, before anything uploads to it ──────────────
  # Every build job stages its assets with softprops/action-gh-release, which CREATES
  # the release if absent. With four legs starting simultaneously (appimage, windows,
  # macOS ×2) they race to create the same draft, and the losers can 422 or produce a
  # duplicate. Serialising creation here — and only creation — makes the uploads
  # idempotent; they still run fully in parallel afterwards.
  draft:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — leaving it as-is"
          else
            echo "creating draft release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi

  appimage:
    needs: [guard, draft]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-22.04   # oldest supported glibc → widest AppImage compatibility
    steps:
      - uses: actions/checkout@v4

      # ── Version comes from version.h → the AppImage asset filename (NOT the git
      # tag, whose format is constrained by the release process). The updater reads
      # the version from the asset name, so the tag here is free-form. Log both. ───
      - name: Report version
        run: |
          maj=$(sed -n 's/^#define PINPOINT_VERSION_MAJOR[[:space:]]*\([0-9]*\).*/\1/p' src/Core/version.h)
          min=$(sed -n 's/^#define PINPOINT_VERSION_MINOR[[:space:]]*\([0-9]*\).*/\1/p' src/Core/version.h)
          pfx=$(sed -n 's/^#define PINPOINT_VERSION_POSTFIX[[:space:]]*"\([^"]*\)".*/\1/p' src/Core/version.h)
          echo "version.h → v${maj}.${min}${pfx} (embedded in the AppImage asset name)"
          echo "git tag    → ${GITHUB_REF_NAME} (free-form; not parsed by the updater)"

      # ── System dependencies (mirrors BUILDING.md → Linux) ───────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git \
            libglib2.0-dev libaravis-dev libudev-dev libopencv-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libespeak-ng-dev libvulkan-dev glslc \
            fuse libfuse2 zsync

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          modules: 'qtmultimedia qtwebsockets qtquick3d qtshadertools qtserialport qtconnectivity'

      # ── AppImage tooling (linuxdeploy + Qt plugin, appimagetool, appimageupdatetool) ─
      - name: Install AppImage tooling
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$HOME/.local/bin/linuxdeploy-plugin-qt" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fsSL -o "$HOME/.local/bin/appimageupdatetool" \
            https://github.com/AppImageCommunity/AppImageUpdate/releases/download/continuous/appimageupdatetool-x86_64.AppImage
          chmod +x "$HOME/.local/bin/"*
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ── Build + bundle + zsync, UNSIGNED (resolves version from version.h) ──────
      - name: Package AppImage (unsigned)
        env:
          CMAKE_PREFIX: ${{ env.QT_ROOT_DIR }}
          JOBS: '2'   # GitHub-hosted runners are small; keep memory in check
        run: tools/package_appimage.sh --no-sign

      # ── Stage as a DRAFT release. The maintainer signs locally, uploads the .sig,
      # and publishes (un-drafts) per the runbook — only then is it live to users. ─
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true            # NOT live until locally signed + published
          prerelease: false      # at publish time: non-prerelease so `latest` resolves (design §7)
          generate_release_notes: true
          files: |
            dist/PinPointStudio-*-x86_64.AppImage
            dist/PinPointStudio-*-x86_64.AppImage.zsync

  # ── Windows: build the UNSIGNED -core installer (the WinSparkle enclosure) and
  # stage it on the same DRAFT release. The maintainer signs locally with the offline
  # EdDSA key, generates appcast-win.xml (packaging/make_appcast.ps1), uploads both,
  # and publishes — only then is it live to users (docs/implementation/
  # windows_release_runbook.md, design docs/design/windows_update.md). No signing
  # secrets here. The hosted runner has no NVIDIA GPU, so it builds the hardware-
  # agnostic -core only; the -cuda runtime is built/managed separately (design §4.4).
  #
  # STATUS: scaffolding — authored, not yet run. Heavy FetchContent (whisper/ViTPose/
  # ORT) makes the first run slow; validate by pushing a test tag.
  windows:
    needs: [guard, draft]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version (version.h → asset name)
        shell: bash
        run: |
          maj=$(sed -n 's/^#define PINPOINT_VERSION_MAJOR[[:space:]]*\([0-9]*\).*/\1/p' src/Core/version.h)
          min=$(sed -n 's/^#define PINPOINT_VERSION_MINOR[[:space:]]*\([0-9]*\).*/\1/p' src/Core/version.h)
          pfx=$(sed -n 's/^#define PINPOINT_VERSION_POSTFIX[[:space:]]*"\([^"]*\)".*/\1/p' src/Core/version.h)
          # Asset name reflects the version.h string / tag (e.g. v0.1-alpha3); the internal
          # Inno AppVersion stays numeric (CMake derives it from the same version.h).
          echo "PP_VERSION=v${maj}.${min}${pfx}" >> "$GITHUB_ENV"
          echo "asset version → v${maj}.${min}${pfx} (tag ${GITHUB_REF_NAME})"

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          modules: 'qtmultimedia qtwebsockets qtquick3d qtshadertools qtserialport qtconnectivity'

      - name: Install Ninja + Inno Setup
        run: choco install ninja innosetup --no-progress -y

      - name: Configure + build (Release, core only)
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPP_SHIPPING_BUILD=ON -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" || exit /b 1
          cmake --build build --target PinPointStudio || exit /b 1

      - name: Package -core installer (UNSIGNED)
        shell: cmd
        run: |
          cd build
          cpack -G INNOSETUP -D CPACK_COMPONENTS_ALL=core -D CPACK_PACKAGE_FILE_NAME=PinPointStudioSetup-%PP_VERSION%-core || exit /b 1

      - name: Stage on draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true            # maintainer signs + adds appcast-win.xml + publishes
          prerelease: false
          files: |
            build/PinPointStudioSetup-*-core.exe

  # ── macOS: build the UNSIGNED .dmg (the Sparkle enclosure) and stage it on the same
  # DRAFT release. The maintainer Developer ID-signs + notarizes the EXACT DMG locally,
  # generates appcast-mac.xml (packaging/make_appcast_mac.sh), uploads both, and
  # publishes — only then is it live to users (docs/implementation/macos_release_runbook.md,
  # design docs/design/macos_update.md). No signing/notarization/EdDSA secrets here.
  #
  # TWO LEGS, one per architecture — they differ only in which runner they land on, so
  # this is a matrix rather than a copied job. Each produces its OWN DMG and its own
  # Sparkle feed; the two are never mixed (design §4.1 — each architecture's binary only
  # ever sees its own feed).
  #
  #   x86_64 → macos-15-intel   arm64 → macos-15
  #
  # Runner choice is time-sensitive, so state the reasoning rather than just the labels:
  #   • macos-13 (the previous pin) was RETIRED in December 2025. It is not a valid label
  #     any more — leaving it here would fail to allocate a runner, not build an Intel DMG.
  #   • macos-15-intel is the LAST x86_64 image GitHub will offer, available until
  #     August 2027. Apple has dropped Intel; there is no successor. When that date lands,
  #     the x86_64 leg stops being buildable here and the appcast-mac.xml feed goes frozen
  #     rather than broken — existing Intel installs keep polling a feed that simply stops
  #     gaining entries.
  #   • macos-14 is NOT used even though it is older: it entered deprecation on 6 July 2026
  #     and is unsupported from 2 November 2026. macos-15 is the oldest SUPPORTED arm64.
  # Re-check these against actions/runner-images before relying on them.
  #
  # The runner's OS also sets the shipped floor: Homebrew bottles are built for the host's
  # macOS, so the DMG's real minimum is roughly the runner's version (~15.0 on both legs),
  # NOT the CMAKE_OSX_DEPLOYMENT_TARGET we pin. package_macos.sh computes that floor from
  # the built closure and stamps it into Info.plist, and make_appcast_mac.sh reads it back
  # out of the signed bytes — so the feed cannot promise a floor the enclosure fails to meet.
  # This is also why a DMG built on the maintainer's own (newer) Mac must not be shipped.
  #
  # STATUS: scaffolding — authored, not yet run. Heavy FetchContent (whisper/ViTPose/ORT)
  # + a full Release build make the first run slow; validate by pushing a test tag.
  macos:
    needs: [guard, draft]
    if: needs.guard.outputs.proceed == 'true'
    strategy:
      # Load-bearing: a flaky Intel leg must NOT cancel a good arm64 DMG (and vice versa).
      # Either DMG is independently useful, and the publish gate below is what insists on
      # having both before anything goes live.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version (version.h → asset name)
        run: |
          maj=$(sed -n 's/^#define PINPOINT_VERSION_MAJOR[[:space:]]*\([0-9]*\).*/\1/p' src/Core/version.h)
          min=$(sed -n 's/^#define PINPOINT_VERSION_MINOR[[:space:]]*\([0-9]*\).*/\1/p' src/Core/version.h)
          pfx=$(sed -n 's/^#define PINPOINT_VERSION_POSTFIX[[:space:]]*"\([^"]*\)".*/\1/p' src/Core/version.h)
          echo "asset version → v${maj}.${min}${pfx} (tag ${GITHUB_REF_NAME}, ${{ matrix.arch }})"

      # Fail EARLY if the runner is not the architecture this leg is meant to build. The
      # packaging script derives the DMG name from the binary, so a wrong runner would
      # otherwise produce a correctly-named DMG for the wrong leg and upload it happily.
      - name: Assert runner architecture
        run: |
          set -euo pipefail
          got="$(uname -m)"
          echo "runner ${{ matrix.runner }} reports: $got"
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "::error::expected ${{ matrix.arch }} but runner is $got — the ${{ matrix.runner }} label has changed architecture"
            exit 1
          }

      # CMake probes Homebrew for these; absent on a fresh runner.
      # opencv@4, NOT opencv: the plain formula is 5.x now, which this project does not
      # build against (CMakeLists rejects it explicitly with the same rationale).
      - name: Install Homebrew deps (OpenCV 4 / FFmpeg / Aravis)
        run: brew install opencv@4 ffmpeg aravis

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          modules: 'qtmultimedia qtwebsockets qtquick3d qtshadertools qtserialport qtconnectivity'

      # package_macos.sh builds Release (PINPOINT_INSTALLED=ON), runs macdeployqt,
      # relocates the Homebrew closure, VERIFIES self-containment and that every @rpath
      # dependency resolves (fails the job if not), derives the DMG name from the built
      # binary, and cross-checks the baked Sparkle feed against that arch.
      # --no-sign: no cert in CI, by design.
      - name: Build + package UNSIGNED DMG
        env:
          CMAKE_PREFIX: ${{ env.QT_ROOT_DIR }}
          JOBS: '3'   # hosted macOS runners are small
        run: tools/package_macos.sh --no-sign

      # The DMG name comes from the BUILT BINARY, so a file carrying this leg's arch can
      # only exist if the binary really was that arch. Insisting on exactly one also
      # catches a dist/ left dirty by a previous step.
      - name: Assert exactly one ${{ matrix.arch }} DMG was produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/PinPointStudio-*-${{ matrix.arch }}.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one ${{ matrix.arch }} DMG, found ${#dmgs[@]}"
            ls -la dist/ 2>/dev/null || true
            exit 1
          fi
          echo "OK: ${dmgs[0]}"

      - name: Stage on draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true            # maintainer signs + notarizes + adds the appcasts + publishes
          prerelease: false
          files: |
            dist/PinPointStudio-*-${{ matrix.arch }}.dmg

  # ── Both macOS DMGs must be present before the draft is fit to publish ─────────
  # `fail-fast: false` means one leg can fail while the other succeeds, and a draft
  # holding a single DMG looks perfectly healthy in the GitHub UI. Publishing it would
  # leave one architecture's feed pointing at a release with no enclosure for it — and
  # because the maintainer signs and publishes by hand later, this is the only automated
  # place that can notice. It does NOT publish anything; it just refuses to go green,
  # so a half-built draft is visibly not ready.
  #
  # `if: always()` is required — without it this is skipped (not failed) the moment a
  # matrix leg fails, which is exactly the case it exists to catch.
  macos-assets-complete:
    needs: [guard, macos]
    if: always() && needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require both an x86_64 and an arm64 DMG on the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
                      --json assets --jq '.assets[].name' 2>/dev/null || true)"
          echo "assets on ${GITHUB_REF_NAME}:"
          echo "${assets:-  (none)}"
          missing=0
          for arch in x86_64 arm64; do
            if ! echo "$assets" | grep -q -- "-${arch}\.dmg$"; then
              echo "::error::no ${arch} DMG on the draft release — do NOT publish; that architecture would have a feed with no enclosure"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "both macOS DMGs present — draft is ready for local signing + notarization"
